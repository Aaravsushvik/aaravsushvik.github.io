- name: Verify required files
  shell: bash
  run: |
    set -u

    files=(
      "theme.js"
      "manifest.json"
      "favicon.svg"
      "index.html"
      "style.css"
      "script.js"
      "translations.js"
      "sw.js"
      "offline.html"
      "404.html"
      "sitemap.xml"
      "robots.txt"
      "images/apple-touch-icon.png"
      "images/icon-192.png"
      "images/icon-512.png"
      "images/IMG_2358_Original.jpeg"
    )

    missing=0

    for file in "${files[@]}"; do
      if [[ -f "$file" ]]; then
        echo "✓ FOUND: $file"
      else
        echo "✗ MISSING: $file"
        missing=1
      fi
    done

    if [[ "$missing" -ne 0 ]]; then
      echo ""
      echo "Required file verification FAILED."
      exit 1
    fi

    echo ""
    echo "All required files are present."