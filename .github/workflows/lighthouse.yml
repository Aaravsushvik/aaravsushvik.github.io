name: Lighthouse CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f theme.js
          test -f translations.js
          test -f sw.js
          test -f manifest.json
          test -f favicon.svg
          test -f offline.html
          test -f 404.html
          test -f sitemap.xml
          test -f robots.txt
          test -f images/apple-touch-icon.png
          test -f images/icon-192.png
          test -f images/icon-512.png
          test -f images/IMG_2358_Original.jpeg
          echo "All required files are present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare minified build
        run: |
          mkdir -p dist
          cp index.html style.css manifest.json favicon.svg offline.html 404.html robots.txt sitemap.xml dist/
          cp -r images dist/
          npx terser script.js -o dist/script.js
          npx terser theme.js -o dist/theme.js
          npx terser translations.js -o dist/translations.js
          npx terser sw.js -o dist/sw.js

      - name: Install Lighthouse CI (pinned)
        run: npm install -g @lhci/cli@0.14.0

      - name: Run Lighthouse CI
        run: |
          npx --yes serve@14.2.0 dist -l 8080 --compress > /tmp/serve.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              echo "Server is ready"
              READY=1
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Server failed to start."
            cat /tmp/serve.log
            exit 1
          fi

          lhci autorun --config=.lighthouserc.json